<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERVISEGPUQ | INICIO - Gateway Corporativo</title>
    
    <!-- Fonts & GSAP -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --blue: #2B2EAA;
            --blue-bright: #5558E3;
            --dark: #05060F;
            --white: #F0F2FF;
        }

        /* Reset */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
        body { background-color: var(--dark); color: var(--white); font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; -webkit-font-smoothing: antialiased; }

        /* CURSOR */
        #dot { width: 4px; height: 4px; background: var(--blue-bright); position: fixed; z-index: 22000; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #ring { width: 34px; height: 34px; border: 1.5px solid rgba(85,88,227,0.3); position: fixed; z-index: 21999; border-radius: 50%; transform: translate(-50%, -50%); transition: all 0.2s ease-out; pointer-events: none; }

        /* SPLIT SCREEN LANDING */
        .gateway { display: flex; height: 100vh; overflow: hidden; background: #000; }
        .world { position: relative; width: 50%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); filter: grayscale(1) brightness(0.6); text-decoration: none; border-right: 1px solid rgba(255,255,255,0.05); padding-bottom: 100px; }
        .world:hover { width: 60%; filter: grayscale(0) brightness(1); }
        .world:hover + .world { width: 40%; }
        
        .bg-img { position: absolute; inset: 0; z-index: 1; transition: 1s transform ease; transform: scale(1.1); }
        .bg-img img { width: 100%; height: 100%; object-fit: cover; }
        .bg-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(5,6,15,0.95) 15%, rgba(5,6,15,0.6) 60%); }
        .world:hover .bg-img { transform: scale(1); }

        .world-content { position: relative; z-index: 10; text-align: center; }
        .world-tag { font-family: 'Rajdhani'; color: var(--blue-bright); font-weight: 700; font-size: 11px; letter-spacing: 6px; margin-bottom: 1.5rem; display: block; opacity: 0.6; }
        .world h2 { font-family: 'Orbitron'; font-size: clamp(32px, 4vw, 56px); margin-bottom: 2.5rem; letter-spacing: 5px; color: #FFFFFF; transition: 0.5s; }
        .world h2 span { display: block; opacity: 0.2; font-size: clamp(12px, 1.2vw, 16px); -webkit-text-stroke: 1px #FFFFFF; color: transparent; margin-bottom: 10px; }
        
        /* LIGHT THEME OVERRIDES */
        body.light { background-color: #F5F5F7; color: #1d1d1f; }
        body.light .gateway { background: #FFFFFF; }
        body.light .world { filter: grayscale(0.2) brightness(1); border-right: 1px solid rgba(0,0,0,0.05); }
        body.light .world h2 { color: #1d1d1f; }
        body.light .world h2 span { -webkit-text-stroke: 1px #1d1d1f; }
        body.light .bg-img::after { background: linear-gradient(0deg, rgba(255,255,255,0.9) 10%, transparent 60%); }
        body.light .logo-box { background: #FFFFFF; border: 1px solid rgba(0,0,0,0.05); }

        /* THEME TOGGLE BUTTON */
        .theme-toggle { position: fixed; bottom: 40px; right: 40px; z-index: 10000; width: 50px; height: 50px; background: rgba(5,6,15,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s; color: white; }
        body.light .theme-toggle { background: rgba(255,255,255,0.8); border-color: rgba(0,0,0,0.1); color: #1d1d1f; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .theme-toggle:hover { transform: scale(1.1) rotate(15deg); }
        
        .btn-enter { display: inline-block; min-width: 300px; text-align: center; padding: 26px 0; background: rgba(255,255,255,0.1); color: var(--white); font-family: 'Rajdhani'; font-weight: 700; letter-spacing: 6px; font-size: 18px; border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase; transition: 0.3s; opacity: 0; transform: translateY(20px); backdrop-filter: blur(10px); clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }
        .world:hover .btn-enter { opacity: 1; transform: translateY(0); background: var(--blue); border-color: var(--blue-bright); }

        /* MOBILE RESPONSIVITY */
        @media (max-width: 800px) {
            *, *::before, *::after { cursor: auto !important; }
            #dot, #ring { display: none !important; }
            .gateway { flex-direction: column !important; height: auto !important; }
            .world { width: 100% !important; height: 50vh !important; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); filter: grayscale(0) brightness(1); padding-bottom: 40px !important; }
            .world:hover { width: 100% !important; height: 50vh !important; }
            .world-content { padding: 0 20px; }
            .world h2 { margin-bottom: 1.5rem; font-size: 32px !important; }
            .world-tag { font-size: 10px; letter-spacing: 4px; opacity: 1; }
            .btn-enter { opacity: 1; transform: translateY(0); border-color: var(--blue-bright); background: rgba(43,46,170,0.5); font-size: 11px !important; }
            .cctv-overlay { padding: 80px 20px 20px !important; font-size: 9px !important; }
            .global-clock { width: 90%; font-size: 10px; padding: 8px 15px; bottom: 15px; }
        }

        /* HEADER & LOGO */
        .header-top { position: fixed; top: 0; left: 0; width: 100%; height: 120px; z-index: 1000; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .logo-box { padding: 25px 50px; background: rgba(5, 6, 15, 0.5); backdrop-filter: blur(20px); border-radius: 0 0 30px 30px; border: 1px solid rgba(255,255,255,0.05); border-top: none; }
        .logo-box img { height: 74px; }

        @media (max-width: 800px) {
            .header-top { height: 120px; }
            .logo-box { padding: 10px 20px; border-radius: 0 0 15px 15px; width: 100%; display: flex; justify-content: center; background: rgba(5,6,15,0.9); }
            .logo-box img { height: 40px; }
        }

        /* CCTV Aesthetic Overlay - FIXED & REFORZADO */
        .cctv-overlay { position: fixed; inset: 0; z-index: 1500; pointer-events: none; padding: 60px 40px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Rajdhani'; font-weight: 700; color: rgba(255,255,255,0.9); font-size: 14px; letter-spacing: 3px; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
        .cctv-top { display: flex; justify-content: space-between; }
        .rec-dot { display: flex; align-items: center; gap: 12px; color: #ff0000; font-weight: 900; }
        .rec-dot::before { content: ''; display: inline-block; width: 10px; height: 10px; background: #ff0000; border-radius: 50%; animation: blink 1s infinite; box-shadow: 0 0 15px #ff0000, 0 0 5px #ff0000; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }
        .scanlines { position: fixed; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%); z-index: 1400; background-size: 100% 4px; pointer-events: none; opacity: 0.3; }

        /* VIDEO INTRO OVERLAY */
        #intro-overlay { position: fixed; inset: 0; background: #05060F; z-index: 20000; display: flex; align-items: center; justify-content: center; transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s; }
        
        .video-terminal { width: 95%; max-width: 1000px; display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 2; }
        
        .terminal-header { display: flex; justify-content: space-between; align-items: center; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,0.4); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .terminal-status { color: #00ff66; animation: blink 1.5s infinite; }
        
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid rgba(85,88,227,0.25); overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(85,88,227,0.1); }
        #intro-video { width: 100%; height: 100%; object-fit: contain; }
        
        /* CORNERS */
        .corner { position: absolute; width: 15px; height: 15px; border: 2px solid var(--blue-bright); z-index: 5; }
        .corner.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .corner.br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        /* CONTROLS BELOW VIDEO */
        .intro-controls { display: flex; gap: 20px; align-items: center; justify-content: center; margin-top: 10px; }
        .intro-btn { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 3px; padding: 12px 24px; background: rgba(5,6,15,0.75); border: 1px solid rgba(255,255,255,0.1); color: var(--white); text-transform: uppercase; cursor: pointer; backdrop-filter: blur(15px); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; gap: 8px; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .intro-btn:hover { background: var(--blue); border-color: var(--blue-bright); box-shadow: 0 0 20px rgba(85,88,227,0.4); transform: translateY(-2px); }
        .intro-btn:active { transform: translateY(0); }

        #intro-overlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
</head>
<body>

    <!-- VIDEO INTRO OVERLAY -->
    <div id="intro-overlay">
        <div class="video-terminal">
            <div class="terminal-header">
                <span class="terminal-title">SYSTEM_FEED // CAM_00_INTRO</span>
                <span class="terminal-status">CONNECTED</span>
            </div>
            <div class="video-wrapper">
                <video id="intro-video" playsinline preload="auto">
                    <source src="https://github.com/fhranco/serviseg-puq/releases/download/seguridad/intro.mp4" type="video/mp4">
                    <source src="assets/intro.webm" type="video/webm">
                </video>
                <!-- Corners -->
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
            <div class="intro-controls">
                <button class="intro-btn" id="audioBtn">
                    <span id="audioIcon">🔊</span> <span id="audioText">Silenciar</span>
                </button>
                <button class="intro-btn" id="skipBtn">
                    Omitir <span style="font-size: 16px; margin-left: 2px;">➔</span>
                </button>
            </div>
        </div>
    </div>

    <!-- THEME TOGGLE -->
    <div class="theme-toggle" id="themeBtn">🌓</div>

    <!-- CURSOR -->
    <div id="dot"></div>
    <div id="ring"></div>

    <div class="header-top">
        <div class="logo-box"><img src="logo.svg"></div>
    </div>

    <div class="gateway">
        <!-- Ingeniería -->
        <a href="ingenieria.html" class="world ibe">
            <div class="scanlines"></div>
            <div class="cctv-overlay">
                <div class="cctv-top">
                    <div class="rec-dot">REC</div>
                    <div class="cam-id">CAM_02 // VISTA_ENTRADA</div>
                </div>
                <div class="cctv-bottom">
                    <div>PUQ_SECTOR_SUR</div>
                </div>
            </div>
            <div class="bg-img"><img src="assets/cctv_hero_public.png"></div>
            <div class="world-content">
                <span class="world-tag">SERVICIOS TÉCNICOS</span>
                <h2><span>DIVISIÓN</span>INGENIERÍA</h2>
                <div class="btn-enter">Ingresar</div>
            </div>
        </a>

        <!-- Seguridad -->
        <a href="seguridad.html" class="world sbe">
            <div class="scanlines"></div>
            <div class="cctv-overlay">
                <div class="cctv-top">
                    <div class="rec-dot">REC</div>
                    <div class="cam-id">CAM_01 // VISTA_ENTRADA</div>
                </div>
                <div class="cctv-bottom">
                    <div>PUQ_SECTOR_NORTE</div>
                </div>
            </div>
            <div class="bg-img"><img src="assets/hero-seguridad.webp" style="object-position: 20% center;"></div>
            <div class="world-content">
                <span class="world-tag">OPERACIONES DE SEGURIDAD</span>
                <h2><span>DIVISIÓN</span>SEGURIDAD PRIVADA</h2>
                <div class="btn-enter">Ingresar</div>
            </div>
        </a>
    </div>

    <script>
        const dot=document.getElementById('dot'), ring=document.getElementById('ring');
        let mX=0, mY=0, rX=0, rY=0;
        document.querySelectorAll('.world').forEach(el=>{
            el.addEventListener('mouseenter', ()=>document.body.classList.add('active'));
            el.addEventListener('mouseleave', ()=>document.body.classList.remove('active'));
        });

        // Theme Toggle Logic
        const themeBtn = document.getElementById('themeBtn');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });
        if(localStorage.getItem('theme') === 'light') document.body.classList.add('light');

        document.addEventListener('mousemove', e=>{ mX=e.clientX; mY=e.clientY; dot.style.transform=`translate(${mX}px,${mY}px)`; });
        function move(){ rX+=(mX-rX)*0.15; rY+=(mY-rY)*0.15; ring.style.transform=`translate(${rX}px,${rY}px)`; requestAnimationFrame(move); }
        move();

        // INTRO OVERLAY LOGIC WITH GSAP ENTRANCE
        const introOverlay = document.getElementById('intro-overlay');
        const introVideo = document.getElementById('intro-video');
        const skipBtn = document.getElementById('skipBtn');
        const audioBtn = document.getElementById('audioBtn');
        const audioIcon = document.getElementById('audioIcon');
        const audioText = document.getElementById('audioText');
        const worlds = document.querySelectorAll('.world');
        const headerTop = document.querySelector('.header-top');

        // Initial state for entrance animation if video is playing
        const hasSeenIntro = sessionStorage.getItem('introSeen') === 'true';

        if (hasSeenIntro) {
            if (introOverlay) introOverlay.remove();
        } else {
            // Hide main content initially to make entrance cleaner
            gsap.set(worlds, { opacity: 0, scale: 1.05 });
            gsap.set(headerTop, { opacity: 0, y: -20 });
            
            // Try to autoplay with audio active first
            introVideo.muted = false;
            introVideo.play().catch(err => {
                console.log("Autoplay con sonido bloqueado por navegador. Reproduciendo en mudo...", err);
                // Fallback: Mute and play
                introVideo.muted = true;
                audioIcon.textContent = '🔇';
                audioText.textContent = 'Activar Sonido';
                introVideo.play().catch(err2 => {
                    console.log("Fallo la reproducción en mudo:", err2);
                });
            });

            function closeIntro() {
                if (!introOverlay) return;
                introVideo.pause();
                introOverlay.classList.add('fade-out');
                
                // GSAP Entrance for the main content
                gsap.to(worlds, {
                    opacity: 1,
                    scale: 1,
                    duration: 1.5,
                    stagger: 0.3,
                    ease: "power4.out",
                    delay: 0.2
                });

                // GSAP Entrance for the header/logo
                gsap.to(headerTop, {
                    opacity: 1,
                    y: 0,
                    duration: 1.2,
                    ease: "power3.out",
                    delay: 0.8
                });

                setTimeout(() => {
                    introOverlay.remove();
                }, 1000);
                sessionStorage.setItem('introSeen', 'true');
            }

            skipBtn.addEventListener('click', closeIntro);
            introVideo.addEventListener('ended', closeIntro);

            audioBtn.addEventListener('click', () => {
                if (introVideo.muted) {
                    introVideo.muted = false;
                    introVideo.volume = 1.0;
                    // Forzar reproducción al activar sonido por si el navegador retuvo el flujo
                    introVideo.play().catch(e => console.log("Error al forzar audio:", e));
                    audioIcon.textContent = '🔊';
                    audioText.textContent = 'Silenciar';
                } else {
                    introVideo.muted = true;
                    audioIcon.textContent = '🔇';
                    audioText.textContent = 'Activar Sonido';
                }
            });
        }
    </script>

</body>
</html>
